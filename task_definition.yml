# Multi-path DATABASE task — Matura czerwiec 2021 v3 (termin dodatkowy), zad 6.1–6.5 („Koncerty").
#
# The task can be solved THREE interchangeable ways within ONE repository:
#   * SQL         — the student writes MySQL directly in the editor;
#   * ACCESS      — the student uploads a Microsoft Access file (.accdb/.mdb) whose saved queries
#                   the worker extracts with Jackcess;
#   * LIBREOFFICE — the student uploads a LibreOffice Base file (.odb) whose saved queries the
#                   worker extracts from content.xml (ZIP + XML, no library).
#
# In all three cases the saved queries are extracted DETERMINISTICALLY (no LLM), normalized to
# MySQL, placed into the `-- task_N BEGIN/END` sections, and graded by the SAME pipeline — the
# C++ checkers, which work unchanged because they only see the final result rows.
#
# ACCESS/LIBREOFFICE = ONE named query = ONE SELECT per subtask, so every subtask is authored as a
# single portable SELECT. 6.5 splits concerts into weekends/weekdays: the MySQL/.odb paths use
# DAYOFWEEK(data) IN (1,7); the ACCESS path uses Weekday([data]) IN (1,7) (Access numbers 1=Sunday …
# 7=Saturday), which the worker's AccessDialectConverter.rewriteWeekday() rewrites to DAYOFWEEK — the
# same 1=Sunday base, so it is row-equivalent. Weekend/weekday tallies use SUM(CASE WHEN …) on the
# MySQL/.odb paths and Sum(Abs(cond)) on the ACCESS path (IIf is fail-closed by the converter). See
# solutions/HOW_TO_CREATE_ACCDB.md.
sourceFile: src/query.sql

# Allowed submission "languages" the student picks from.
languages: [SQL, ACCESS, LIBREOFFICE]

limits:
  time: 30000
  memory: 512000

